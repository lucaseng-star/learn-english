<!doctype html>

<head>

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="秒回 —— 手机上的客户消息回复台：按等待时长排队，AI 起草，你改一句就发。">
<title>秒回 · 客户消息回复台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=1">

<symbol id="i-send" viewBox="0 0 24 24"><path d="M20.6 3.4 3.6 10.2l6.5 2.6M20.6 3.4l-3 17-4.1-5.9M20.6 3.4 10.1 12.8v5.5l3.4-3.4"/></symbol>

<!-- 课程卡缩略图 -->
<symbol id="pic-course" viewBox="0 0 132 104"><rect width="132" height="104" fill="#efe7dd"/><rect y="72" width="132" height="32" fill="#c79a63"/><rect y="72" width="132" height="5" fill="#b3874f"/><rect x="20" y="30" width="24" height="42" rx="4" fill="#fbf8f4"/><rect x="26" y="22" width="12" height="9" rx="2" fill="#e6ded3"/><rect x="24" y="46" width="16" height="12" rx="2" fill="#e9e2d8"/><rect x="50" y="20" width="30" height="52" rx="5" fill="#fdfbf8"/><rect x="60" y="10" width="10" height="11" rx="2" fill="#dcd3c7"/><rect x="55" y="40" width="20" height="16" rx="2" fill="#ece5da"/><rect x="86" y="38" width="20" height="34" rx="4" fill="#f7f1e6"/><rect x="90" y="30" width="12" height="9" rx="2" fill="#dfd6c8"/><rect x="88" y="50" width="16" height="10" rx="2" fill="#e7dfd0"/><path d="M108 72c0-10 5-16 11-16s11 6 11 16Z" fill="#8fae7a"/></symbol>
</defs></svg>

<div class="phone">

  <!-- ══ 待回队列 ══════════════════════════════════════════ -->
  <section class="screen screen--queue" aria-label="待回队列">
    <header class="topbar">
      <h1>待回</h1>
      <span class="grow"></span>
      <button class="iconbtn" type="button" aria-label="搜索会话"><svg class="ic"><use href="#i-search"/></svg></button>
      <button class="iconbtn" type="button" aria-label="设置"><svg class="ic"><use href="#i-gear"/></svg></button>
    </header>

    <dl class="pulse" id="pulse">
      <div><dt>待回</dt><dd class="num"><span id="stat-open">5</span></dd></div>
      <div><dt>今日已回</dt><dd class="num"><span id="stat-done">14</span></dd></div>
      <div class="is-hot"><dt>最久等待</dt><dd class="num"><span id="stat-worst">96</span> <small>分</small></dd></div>
    </dl>

    <div class="chips" role="tablist" aria-label="队列筛选">
      <button class="chip" type="button" role="tab" data-filter="open"   aria-selected="true">待回复 <b class="num" data-count="open">5</b></button>
      <button class="chip" type="button" role="tab" data-filter="follow" aria-selected="false">跟进中 <b class="num" data-count="follow">1</b></button>
      <button class="chip" type="button" role="tab" data-filter="done"   aria-selected="false">已完成 <b class="num" data-count="done">1</b></button>
      <button class="chip" type="button" role="tab" data-filter="all"    aria-selected="false">全部 <b class="num" data-count="all">7</b></button>
    </div>

    <ul class="qlist" id="qlist"></ul>

    <div class="dock">
      <button class="primary" id="startQueue" type="button">
        <svg class="ic ic--sm"><use href="#i-bolt"/></svg>
        <span>开始清队列</span><span class="n" id="queueN">· 5 条</span>
      </button>
    </div>
  </section>

  <!-- ══ 会话 + 回复台 ═════════════════════════════════════ -->
  <section class="screen screen--chat" id="chat" aria-label="会话">
    <div class="qbar" id="qbar" hidden>
      <span class="num" id="qbarText">1 / 5</span>
      <span class="track"><span class="fill" id="qbarFill" style="width:0%"></span></span>
      <button type="button" id="qbarSkip">跳过</button>
      <button type="button" id="qbarExit">退出</button>
    </div>

    <header class="chathead">
      <button class="back" type="button" id="back" aria-label="返回队列"><svg class="ic ic--lg"><use href="#i-chevron"/></svg></button>
      <span class="ava" id="chatAva"></span>
      <div class="chatwho">
        <h2 id="chatName">—</h2>
        <p id="chatSub">—</p>
      </div>
      <button class="iconbtn" type="button" id="more" aria-label="更多操作"><svg class="ic"><use href="#i-more"/></svg></button>
    </header>

    <details class="ctx" id="ctx">
      <summary>
        <svg class="ic ic--sm"><use href="#i-info"/></svg>
        <span class="grow" id="ctxLine">客户资料</span>
        <svg class="ic ic--sm chev"><use href="#i-chevron"/></svg>
      </summary>
      <dl class="ctxgrid" id="ctxGrid"></dl>
    </details>

    <div class="stream" id="stream"></div>

    <div class="acts">
      <button class="act" type="button" id="actSnooze"><svg class="ic"><use href="#i-clock"/></svg>稍后跟进</button>
      <button class="act" type="button" id="actDone"><svg class="ic"><use href="#i-check2"/></svg>标记完成</button>
      <button class="act" type="button" id="actTag"><svg class="ic"><use href="#i-tag"/></svg>加标签</button>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <button class="iconbtn" type="button" id="openDesk" aria-label="打开回复台" aria-expanded="false">
        <svg class="ic"><use href="#i-asterisk"/></svg>
      </button>
      <span class="inputwrap">
        <label class="sr" for="input">回复内容</label>
        <textarea id="input" rows="1" placeholder="写回复，或点 ✳ 用草稿"></textarea>
      </span>
      <button class="iconbtn" type="button" id="voice" aria-label="语音转文字"><svg class="ic"><use href="#i-mic"/></svg></button>
      <button class="send" type="submit" id="send" aria-label="发送" disabled><svg class="ic"><use href="#i-send"/></svg></button>
    </form>

    <div class="scrim" id="scrim"></div>

    <!-- 回复台 -->
    <div class="desk" id="desk" role="dialog" aria-label="回复台" aria-modal="false">
      <span class="grab"></span>
      <div class="deskhead">
        <h3>回复台</h3>
        <span class="grow"></span>
        <div class="langsw" role="group" aria-label="回复语言">
          <button type="button" data-lang="zh" aria-pressed="true">中</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="bm" aria-pressed="false">BM</button>
        </div>
      </div>
      <div class="desktabs" role="tablist" aria-label="回复台分区">
        <button class="desktab" type="button" role="tab" data-tab="drafts" aria-selected="true">AI 草稿</button>
        <button class="desktab" type="button" role="tab" data-tab="tmpls"  aria-selected="false">快捷话术</button>
        <button class="desktab" type="button" role="tab" data-tab="assets" aria-selected="false">素材</button>
      </div>
      <div class="deskbody" id="deskBody"></div>
    </div>

    <!-- 稍后跟进 -->
    <div class="sheet" id="snoozeSheet" role="dialog" aria-label="稍后跟进">
      <h3>什么时候提醒我回他？</h3>
      <button type="button" data-snooze="30"><svg class="ic"><use href="#i-clock"/></svg>30 分钟后</button>
      <button type="button" data-snooze="120"><svg class="ic"><use href="#i-clock"/></svg>2 小时后</button>
      <button type="button" data-snooze="tomorrow"><svg class="ic"><use href="#i-clock"/></svg>明早 9:00</button>
      <button type="button" data-snooze="cancel">取消</button>
    </div>

    <!-- 更多 -->
    <div class="sheet" id="moreSheet" role="dialog" aria-label="更多操作">
      <h3 id="moreTitle">更多操作</h3>
      <button type="button" data-more="call"><svg class="ic"><use href="#i-quick"/></svg>转打电话</button>
      <button type="button" data-more="assign"><svg class="ic"><use href="#i-tag"/></svg>转给同事</button>
      <button type="button" data-more="mute"><svg class="ic"><use href="#i-info"/></svg>标记为无效线索</button>
      <button type="button" data-more="cancel">取消</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="ic"><use href="#i-check2"/></svg><span id="toastText">已发送</span>
  </div>
</div>

<!-- APP:BODY:END -->
<script src="app.js?v=1"></script>
</body>
</html>
