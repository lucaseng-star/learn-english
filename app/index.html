<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="solowork">
<meta name="description" content="秒回 v4 可用原型：SOS 通知直达、回客户、清队列、话术、收款确认。示例数据。">
<title>solowork</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=4">
</head>
<body>
<!-- APP:BODY:START -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><defs>

<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v4.6"/><circle cx="12" cy="8.2" r=".95" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-asterisk" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2.4c.9 0 1.6.7 1.6 1.6v4.5l3.2-3.2a1.6 1.6 0 1 1 2.3 2.3l-3.2 3.2H20a1.6 1.6 0 1 1 0 3.2h-4.1l3.2 3.2a1.6 1.6 0 1 1-2.3 2.3l-3.2-3.2V20a1.6 1.6 0 1 1-3.2 0v-4.1l-3.2 3.2a1.6 1.6 0 0 1-2.3-2.3l3.2-3.2H4a1.6 1.6 0 1 1 0-3.2h4.1L4.9 7.6a1.6 1.6 0 0 1 2.3-2.3l3.2 3.2V4c0-.9.7-1.6 1.6-1.6Z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M20.6 3.4 3.6 10.2l6.5 2.6M20.6 3.4l-3 17-4.1-5.9M20.6 3.4 10.1 12.8v5.5l3.4-3.4"/></symbol>

<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.6 7.2a2 2 0 0 1 2-2h4.2l2 2.2h6.6a2 2 0 0 1 2 2v8.2a2 2 0 0 1-2 2H5.6a2 2 0 0 1-2-2Z"/></symbol>

<symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.5 15.2a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55v.17a2.05 2.05 0 0 1-4.1 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H2.6a2.05 2.05 0 0 1 0-4.1h.09A1.7 1.7 0 0 0 4.24 8.8a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.05 2.05 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 9.78 2.8v-.17a2.05 2.05 0 0 1 4.1 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1.03h.17a2.05 2.05 0 0 1 0 4.1h-.09a1.7 1.7 0 0 0-1.55 1.03Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2.6a9.3 9.3 0 0 0-8 14.1L2.7 21.4l4.9-1.3A9.3 9.3 0 1 0 12 2.6Zm5.2 13c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1a13 13 0 0 1-5.7-4.9c-.4-.6-.9-1.5-.9-2.4 0-.9.5-1.4.7-1.6.2-.2.4-.3.6-.3h.5c.2 0 .4-.1.6.4l.8 1.9c.1.2.1.3 0 .5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.2.5.3.1.2.1.5-.1 1.1Z"/></symbol>

<div class="phone">

  <!-- 登录（第一次装才看到） -->
  <section class="screen" id="login" hidden>
    <form class="login" id="loginForm" autocomplete="off">
      <div><div class="brand">JWC ACADEMY</div><h1>solowork</h1></div>
      <label class="field"><span>名字</span><input id="loginName" value="boon" autocapitalize="off"></label>
      <label class="field"><span>密码</span><input id="loginPwd" type="password" value="········"></label>
      <div class="remember"><button type="button" class="switch" id="remember" role="switch" aria-checked="true" aria-label="记住这台手机 30 天"></button><span>记住这台手机 30 天</span></div>
      <button class="primary primary--ink" type="submit">登录</button>
    </form>
  </section>

  <!-- 待回 -->
  <section class="screen" id="queue" hidden>
    <header class="topbar">
      <h1>待回</h1><span class="grow"></span>
      <button class="duty" id="duty" type="button" aria-pressed="true"><i></i><span>值班中</span></button>
      <button class="iconbtn" id="settings" type="button" aria-label="设置"><svg class="ic"><use href="#i-gear"/></svg></button>
    </header>
    <div class="dutyline" id="dutyline">值班：<b>你、佳佳</b></div>
    <div class="chips" id="chips" role="tablist"></div>
    <ul class="qlist" id="qlist"></ul>
    <div class="dock"><button class="primary" id="startQueue" type="button"><svg class="ic ic--sm"><use href="#i-bolt"/></svg><span>开始清队列</span><span class="n" id="queueN"></span></button></div>
  </section>

  <!-- 会话 -->
  <section class="screen screen--push" id="chat" aria-label="会话">
    <header class="chathead">
      <button class="back" type="button" id="back" aria-label="返回"><svg class="ic ic--lg"><use href="#i-chevron"/></svg></button>
      <span class="ava ava--sm" id="chatAva"></span>
      <div class="chatwho"><h2 id="chatName">—</h2><p id="chatLine">—</p></div>
      <span class="chipst" id="chatStatus"></span>
      <button class="iconbtn" type="button" id="more" aria-label="更多"><svg class="ic"><use href="#i-more"/></svg></button>
    </header>
    <div class="ctx" id="ctx"></div>
    <div class="stream" id="stream"><div class="stream-inner" id="streamInner"></div></div>
    <div id="above"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button class="iconbtn" type="button" id="openDesk" aria-label="快捷话术"><svg class="ic"><use href="#i-asterisk"/></svg></button>
      <span class="inputwrap"><label class="sr" for="input">回复</label><textarea id="input" rows="1" placeholder="回复…"></textarea></span>
      <button class="iconbtn" type="button" id="voice" aria-label="语音"><svg class="ic"><use href="#i-mic"/></svg></button>
      <button class="send" type="submit" id="send" aria-label="发送" disabled><svg class="ic"><use href="#i-send"/></svg></button>
    </form>
    <div id="belowComposer"></div>

    <div class="scrim" id="scrim"></div>
    <div class="desk" id="desk" role="dialog" aria-label="话术">
      <span class="grab"></span>
      <div class="deskbody">
        <div class="slashbar"><svg class="ic ic--sm"><use href="#i-asterisk"/></svg>话术 <b class="num" id="slashCount"></b><span>输入框里继续打字就会筛选</span><button type="button" id="slashClose">关闭</button></div>
        <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="tplSearch" placeholder="搜话术，或像 ChatDaddy 一样打 /fcc" autocapitalize="off" autocomplete="off"><small id="tplCount"></small></div>
        <div class="rchips" id="tplRecent" aria-label="置顶和常用"></div>
        <div id="tplList"></div>
        <div class="rchips" id="tplFolders"></div>
      </div>
    </div>
    <div class="preview" id="preview" role="dialog" aria-label="发出去是这样">
      <h4 id="pvName"></h4>
      <div class="pv"><div class="thumb" id="pvThumb"><svg class="ic ic--lg"><use href="#i-image"/></svg></div><p id="pvText"></p></div>
      <div class="two"><button class="big" type="button" id="pvSend">发送</button><button class="soft" type="button" id="pvFill">只填文字，我再改</button></div>
    </div>
    <div class="sheet" id="moreSheet" role="dialog" aria-label="更多">
      <h3 id="moreTitle">更多</h3>
      <button type="button" data-more="handback"><svg class="ic"><use href="#i-check2"/></svg>让 Bot 接管</button>
      <button type="button" data-more="snooze"><svg class="ic"><use href="#i-clock"/></svg>稍后跟进 · 明早 9:00 提醒我</button>
      <button type="button" data-more="assign"><svg class="ic"><use href="#i-phone"/></svg>转给佳佳</button>
      <button type="button" data-more="cancel">取消</button>
    </div>
  </section>

  <!-- IG/FB 给了号码 -->
  <section class="screen screen--push" id="handoff" aria-label="IG/FB 给了号码">
    <header class="chathead">
      <button class="back" type="button" id="backHandoff" aria-label="返回"><svg class="ic ic--lg"><use href="#i-chevron"/></svg></button>
      <div class="chatwho"><h2>IG/FB 给了号码</h2><p>等你打 WhatsApp</p></div>
    </header>
    <div class="qlist" id="handoffList" style="border-top:0"></div>
  </section>

  <!-- 设置 -->
  <div class="sheet" id="settingsSheet" role="dialog" aria-label="设置">
    <h3>设置</h3>
    <button type="button" data-set="duty"><svg class="ic"><use href="#i-clock"/></svg><span id="dutyLabel">下班（不收通知）</span></button>
    <button type="button" data-set="replay"><svg class="ic"><use href="#i-bolt"/></svg>重放一条通知</button>
    <button type="button" data-set="logout" class="danger">退出登录</button>
    <button type="button" data-set="cancel">取消</button>
  </div>
  <div class="scrim" id="scrimGlobal" style="z-index:4"></div>

  <button class="notif" id="notif" type="button">
    <span class="nic"><svg class="ic"><use href="#i-bolt"/></svg></span>
    <div><div class="nt">🆘 <span id="nfName">Sharon</span> 等了 <b class="num" id="nfWait">14 分</b><time id="nfTime"></time></div><div class="nb" id="nfBody"></div><div class="nf">值班：你、佳佳 · 先点先得</div></div>
  </button>
  <div class="install" id="install" hidden>
    <img src="icon-192.png" alt="" width="40" height="40">
    <div><b>装成 app</b><span id="installHow">点 Safari 底部「分享」→「添加到主屏幕」</span></div>
    <button type="button" id="installGo" hidden>安装</button>
    <button type="button" class="x" id="installX" aria-label="关闭">×</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><svg class="ic"><use href="#i-check2"/></svg><span id="toastText"></span></div>
</div>
<!-- APP:BODY:END -->
<script src="app.js?v=4"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
